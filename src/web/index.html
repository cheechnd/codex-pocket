<body>
<div class="shell" id="app" data-view="loading">
  <header class="appbar">
    <a id="home" class="brand" href="/" aria-label="Codex Pocket"><span class="brand-icon" aria-hidden="true">⌘</span><span>Codex Pocket</span></a>
    <div class="app-controls">
      <span id="connection" role="status" data-state="connecting">Connecting</span>
      <details id="settings" class="settings">
        <summary aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary>
        <div class="settings-panel"><strong>Codex Pocket</strong><span id="access-note">Private connection</span><button id="logout" hidden>Unpair this device</button></div>
      </details>
    </div>
  </header>
  <main class="workspace">
    <section id="pairing" class="pairing" hidden>
      <div class="pair-card"><div class="pair-icon" aria-hidden="true">⌘</div><h1>Codex Pocket</h1>
        <form id="pair-form"><label for="pair-code">Pairing code</label><input id="pair-code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Enter code" required><button type="submit">Pair this device</button></form>
      </div>
    </section>
    <section id="picker" hidden aria-label="Conversations">
      <h1 class="sr-only">Conversations</h1>
      <div id="scope" class="scope" role="group" aria-label="Conversation scope"><button id="scope-loaded" type="button" aria-pressed="true">Loaded</button><button id="scope-all" type="button" aria-pressed="false" hidden>All</button></div>
      <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="filter">Filter by title or project</label><input id="filter" type="search" placeholder="Search" autocomplete="off"></div>
      <div id="threads" class="thread-list"></div>
      <button id="more-threads" type="button" hidden>Load more</button>
    </section>
    <section id="welcome" aria-label="No conversation selected"><span class="welcome-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M39 23c0 9-7 15-17 15h-5l-8 5 2-10C6 30 4 26 4 21 4 12 12 5 22 5s17 8 17 18Z"/><path d="M16 20h1m6 0h1m6 0h1"/></svg></span><h2>Messages</h2></section>
    <section id="conversation" hidden aria-label="Selected conversation">
      <header class="chat-header">
        <button id="back" class="back-button" aria-label="← Conversations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
        <div class="contact"><span id="contact-avatar" class="avatar" aria-hidden="true">⌘</span><div class="sr-only"><h2 id="title"></h2><p id="project"></p></div></div>
        <span id="activity" role="status" hidden></span>
      </header>
      <div id="message-scroll" class="message-scroll" tabindex="0" role="region" aria-label="Conversation messages">
        <div class="history-controls"><button id="older" hidden>Load earlier messages</button><span id="history-bound" hidden>History limit reached</span></div>
        <div id="transcript" aria-label="Conversation history"></div>
      </div>
      <button id="new-content" class="new-content" hidden aria-label="Go to latest message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m-7-7 7 7 7-7"/></svg></button>
      <div class="composer">
        <div class="composer-status"><p id="submission-status" role="status"></p><button id="check-submission" hidden>Check send status</button></div>
        <div id="attachments" class="attachments" aria-label="Attached images"></div>
        <div class="input-bar"><label class="sr-only" for="draft">Message</label><textarea id="draft" autocomplete="off" spellcheck="true" rows="1" placeholder="Message" aria-describedby="submission-status"></textarea><button id="attach" class="attach-button" type="button" aria-label="Attach images" title="Attach images" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7L9 18.4a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button><input id="image-input" type="file" accept="image/*" multiple hidden><button id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div>
      </div>
    </section>
    <span id="announcement" class="sr-only" role="status" aria-live="polite"></span><p id="error" class="error" role="alert"></p>
  </main>
</div>
</body>
